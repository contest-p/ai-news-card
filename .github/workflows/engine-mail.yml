name: 뉴스 메일 예약 발송

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check는 설정 검사, check-chat은 AI, check-render는 이미지 진단(메일 없음), run은 실제 발송'
        required: true
        type: choice
        default: check
        options: [check, check-chat, check-render, run]
      delivery_at:
        description: '50~55분 외부 호출은 hourly(다음 정각). ISO 절대 시각도 가능. 빈 값은 즉시 실행'
        required: false
        type: string
        default: ''
      preview_subscription_id:
        description: '구독 직후 미리보기 발송 대상 ID. 빈 값은 전체 정기 배치'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ inputs.mode == 'check-render' && format('engine-render-{0}', github.ref) || (inputs.preview_subscription_id && format('engine-preview-{0}', inputs.preview_subscription_id) || 'engine-mail-production') }}
  cancel-in-progress: false

jobs:
  mail:
    if: >-
      inputs.mode != 'check-render' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'check-chat')) &&
      (github.event_name == 'workflow_dispatch' || vars.ENGINE_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: engine-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: 발송 목표 시각 고정
        if: inputs.mode != 'check-chat'
        id: delivery_target
        env:
          DELIVERY_AT: ${{ inputs.delivery_at }}
          GH_TOKEN: ${{ github.token }}
        run: python3 engine/tools/delivery_target.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/dependencies/requirements*.txt
      - name: Python 의존성 설치
        if: inputs.mode != 'check-chat'
        run: python -m pip install -r engine/dependencies/requirements-rag.txt
      - name: AI 진단 의존성 설치
        if: inputs.mode == 'check-chat'
        run: python -m pip install python-dotenv==1.0.1 google-cloud-firestore==2.21.0
      - name: AI 응답 진단 (메일 전송 없음)
        if: inputs.mode == 'check-chat'
        env:
          ENGINE_FIREBASE_PROJECT: ${{ vars.ENGINE_FIREBASE_PROJECT || 'ai-news-card' }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
        run: python -B -m engine.tools.chat_check
      - name: 설정 확인
        if: inputs.mode != 'check-chat'
        env:
          ENGINE_FIREBASE_PROJECT: ${{ vars.ENGINE_FIREBASE_PROJECT || 'ai-news-card' }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ENGINE_API_BASE_URL: ${{ vars.ENGINE_API_BASE_URL }}
          ENGINE_API_TOKEN: ${{ secrets.ENGINE_API_TOKEN }}
          ENGINE_WEB_BASE_URL: ${{ vars.ENGINE_WEB_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURITY: ${{ vars.SMTP_SECURITY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ENGINE_ARCHIVE_RETENTION_DAYS: ${{ vars.ENGINE_ARCHIVE_RETENTION_DAYS }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON is required"
            exit 1
          fi
          python -B -m engine.tools.run_batch --check --project "$ENGINE_FIREBASE_PROJECT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: github.event_name == 'schedule' || inputs.mode == 'run'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - name: 이미지 렌더러와 한글 폰트 준비
        if: github.event_name == 'schedule' || inputs.mode == 'run'
        run: |
          npm ci --prefix engine
          cd engine
          npx --no-install playwright install --with-deps chromium
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: github.event_name == 'schedule' || inputs.mode == 'run'
        with:
          path: .venv/model-cache
          key: e5-small-ubuntu-24.04-614241f622f53c4eeff9890bdc4f31cfecc418b3-${{ hashFiles('engine/dependencies/requirements-rag*.txt') }}
      - name: 고정 E5 모델 준비
        if: github.event_name == 'schedule' || inputs.mode == 'run'
        run: python -c "from engine.embeddings import E5Encoder; E5Encoder(allow_download=True); print('Embedding model ready')"
      - name: 운영 배치 실행
        if: github.event_name == 'schedule' || inputs.mode == 'run'
        env:
          DELIVERY_AT: ${{ steps.delivery_target.outputs.delivery_at }}
          PREVIEW_SUBSCRIPTION_ID: ${{ inputs.preview_subscription_id }}
          ENGINE_FIREBASE_PROJECT: ${{ vars.ENGINE_FIREBASE_PROJECT || 'ai-news-card' }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ENGINE_API_BASE_URL: ${{ vars.ENGINE_API_BASE_URL }}
          ENGINE_API_TOKEN: ${{ secrets.ENGINE_API_TOKEN }}
          ENGINE_WEB_BASE_URL: ${{ vars.ENGINE_WEB_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURITY: ${{ vars.SMTP_SECURITY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ENGINE_ARCHIVE_RETENTION_DAYS: ${{ vars.ENGINE_ARCHIVE_RETENTION_DAYS }}
          ENGINE_MAX_CARD_JOBS_PER_BATCH: ${{ vars.ENGINE_MAX_CARD_JOBS_PER_BATCH || '0' }}
          CARD_FONT_PATH: frontend/assets/fonts/NanumGothic-Regular.ttf
          TOKENIZERS_PARALLELISM: 'false'
        run: python -B -m engine.tools.run_batch --run --safe-log --project "$ENGINE_FIREBASE_PROJECT" --delivery-at "$DELIVERY_AT" --preview-subscription-id "$PREVIEW_SUBSCRIPTION_ID"

  render-check:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check-render'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Prepare renderer and Korean font
        run: |
          npm ci --prefix engine
          cd engine
          npx --no-install playwright install --with-deps chromium
      - name: Render fixture cards only (no mail or external APIs)
        env:
          CARD_FONT_PATH: frontend/assets/fonts/NanumGothic-Regular.ttf
        run: |
          python -B -m engine.tools.render_template_examples
          python -B -m engine.tools.render_layout_check
