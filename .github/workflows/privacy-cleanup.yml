name: 개인정보 보관 기한 정리

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check는 설정 확인, run은 실제 개인정보 정리'
        required: true
        type: choice
        default: check
        options: [check, run]

permissions:
  contents: read

concurrency:
  group: privacy-cleanup-production
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.ENGINE_PRIVACY_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: engine-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 정리 명령의 최소 의존성 설치
        run: python -m pip install python-dotenv==1.0.1
      - name: 설정 확인
        env:
          ENGINE_API_BASE_URL: ${{ vars.ENGINE_API_BASE_URL }}
          ENGINE_API_TOKEN: ${{ secrets.ENGINE_API_TOKEN }}
        run: python -B -m engine.tools.privacy_cleanup --check
      - name: 개인정보 정리 실행
        if: github.event_name == 'schedule' || inputs.mode == 'run'
        env:
          ENGINE_API_BASE_URL: ${{ vars.ENGINE_API_BASE_URL }}
          ENGINE_API_TOKEN: ${{ secrets.ENGINE_API_TOKEN }}
        run: python -B -m engine.tools.privacy_cleanup --run
